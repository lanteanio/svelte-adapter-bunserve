name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Unit suite (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run the unit suite
        run: npm test
      # The determinism ratchet: every clock/rng/timer read under src/ goes
      # through the runtime seam, or this fails naming the raw call site.
      - name: Determinism seam scan
        run: npm run check:determinism

  sim-golden:
    name: DST golden gate (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Re-runs every committed corpus's seeds under the config it was blessed
      # with, and fails on any fingerprint drift. `adapter-single`'s entries are
      # fingerprint-identical to svelte-adapter-uws's corpus of the same name at
      # the parity pin (verified locally via
      # `node scripts/sim-golden.js --corpus adapter-single --against <uws corpus>`,
      # the same local-ritual shape as probe:uws); this job holds THIS repo to
      # that blessed baseline on every push. `adapter-admission` has no sibling
      # to compare against - it drives this adapter's upgrade ceiling, an app
      # that refuses sockets from inside `open`, and clients that leave
      # mid-handshake.
      - name: Verify the golden corpora
        run: npm run sim:golden

  bun-matrix:
    name: Bun runtime gates (pinned Bun)
    runs-on: ubuntu-latest
    strategy:
      # 1.3.14 is the engines floor; 1.4.0 is the first release of the
      # Zig-to-Rust rewrite and runs as a SECOND lane, not a replacement. The
      # floor moves only after the rewrite has had time in the wild with both
      # lanes green.
      # fail-fast off: a broken 1.4 lane must not cancel the floor lane's
      # verdict, which is the one that decides whether main is releasable.
      fail-fast: false
      matrix:
        bun-version: ['1.3.14', '1.4.0']
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}
      # The probe RECORDS observed Bun behavior; this job holds a Bun upgrade
      # to two hard rules: the probe itself must complete, and no probe may
      # record a FAILED observation. The committed report's diff review stays
      # a human ritual after deliberate upgrades (the report embeds platform
      # and timing lines, so a cross-platform byte-diff would only flake).
      - name: Run the API probe
        run: |
          bun probe/bun-api-facts.mjs
          if grep -q "FAILED" probe/bun-api-facts.report.md; then
            echo "probe recorded FAILED observations:"
            grep -n "FAILED" probe/bun-api-facts.report.md
            exit 1
          fi
      # The source-level gates, on the Bun runtime itself. Unit and sim run
      # one process per file (scripts/bun-test-lane.mjs says why), the two
      # corpora must match the committed Node-blessed fingerprints - which
      # makes this a cross-engine determinism check, not just a pass/fail -
      # and the determinism scan runs the same scanner Node runs.
      - name: Unit lane
        run: bun scripts/bun-test-lane.mjs unit
      - name: Sim lane
        run: bun scripts/bun-test-lane.mjs sim
      - name: Golden corpora
        run: |
          bun --conditions=bunserve-sim scripts/sim-golden.js --corpus adapter-single
          bun --conditions=bunserve-sim scripts/sim-golden.js --corpus adapter-admission
      - name: Determinism scan
        run: bun scripts/check-determinism.js

  publish-hygiene:
    name: Publishing hygiene (publint + attw)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      # Lints the PACKED package, not the checkout: publint validates the
      # export map and file list against what `npm pack` would ship, and attw
      # checks that every export subpath actually resolves for an ESM consumer.
      # These are the failure modes that never surface locally - they break
      # only in a consumer's node_modules, as a confusing downstream report.
      - name: Lint the publishable package
        run: npm run check:publish

  live:
    name: Live wire contract (Bun on Linux)
    runs-on: ubuntu-latest
    strategy:
      # Both generations, same suite: a new runtime implementation is exactly
      # what a wire-contract lane exists to hold still. The floor stays 1.3.14.
      # fail-fast off: a broken 1.4 lane must not cancel the floor lane's
      # verdict, which is the one that decides whether main is releasable.
      fail-fast: false
      matrix:
        bun-version: ['1.3.14', '1.4.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}

      # The ADAPTER's own dependencies, which the fixture build needs: the
      # build step imports rollup from src/index.js, and the fixture resolves
      # it by walking up to this node_modules. Installing only inside
      # test/fixture leaves it unresolvable and the build dies with
      # ERR_MODULE_NOT_FOUND before any suite runs.
      - name: Install the adapter's dependencies
        run: npm install --no-audit --no-fund

      # The fixture builds against the adapter through a `file:` dependency, so
      # it installs from the checkout with no registry copy of the package.
      - name: Install the fixture's dependencies
        working-directory: test/fixture
        run: npm install --no-audit --no-fund

      # Runs the WebSocket wire contract, the subscription cap, Origin
      # enforcement, the no-handler regression, and the graceful-shutdown
      # SIGNAL path. That last one exists only here: on Windows a SIGTERM
      # terminates the built server without the handler running at all, so
      # every assertion about the shutdown ordering is unreachable locally and
      # this job is the only thing that proves it.
      - name: Run the live lane
        run: npm run test:live

  leak:
    name: Standing leak gate (Bun on Linux)
    runs-on: ubuntu-latest
    strategy:
      # The gates are ratio-based, so they survive 1.4's lower absolute
      # baselines (Bun.serve idle memory dropped by roughly a third); what
      # they watch for - a slope - is exactly what a rewritten runtime could
      # reintroduce. The floor stays 1.3.14.
      # fail-fast off: a broken 1.4 lane must not cancel the floor lane's
      # verdict, which is the one that decides whether main is releasable.
      fail-fast: false
      matrix:
        bun-version: ['1.3.14', '1.4.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}

      # Same two installs as the live job, and for the same reason: the fixture
      # build imports rollup from the adapter's node_modules, and the fixture
      # resolves the adapter itself through a `file:` dependency.
      - name: Install the adapter's dependencies
        run: npm install --no-audit --no-fund

      - name: Install the fixture's dependencies
        working-directory: test/fixture
        run: npm install --no-audit --no-fund

      # Its own job rather than a step in the live lane: this one spends
      # minutes by design, because a memory trend needs a window to be fitted
      # over, and a gate that slow inside the dev loop is a gate people stop
      # running. It ends with a self-check that arms a deliberate leak and
      # requires the verdict to fail, so a lane that has quietly stopped being
      # able to fail reports that rather than passing.
      - name: Run the leak lane
        run: npm run test:leak
